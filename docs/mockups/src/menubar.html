<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Super Converter — menu bar</title><link rel="stylesheet" href="shared.css">
<style>
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: rgba(246,247,251,.62); backdrop-filter: blur(30px) saturate(1.8); display: flex; align-items: center; padding: 0 14px; gap: 18px; font-size: 13px; font-weight: 500; color: #16171C; z-index: 5; }
html.dark .menubar { background: rgba(30,31,36,.6); color: #F2F3F7; }
.menubar .app { font-weight: 700; }
.menubar .r { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.menubar .r svg { width: 16px; height: 16px; }
.status.on { background: rgba(0,0,0,.12); border-radius: 5px; padding: 3px 6px; }
.panel { position: absolute; top: 36px; width: 360px; border-radius: 14px; background: rgba(250,251,253,.9); backdrop-filter: blur(40px) saturate(1.8); box-shadow: var(--shadow-pop); padding: 12px; z-index: 6; }
html.dark .panel { background: rgba(38,39,46,.9); }
.mrow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
.mrow:hover, .mrow.hi { background: var(--control); }
.mthumb { width: 40px; height: 40px; border-radius: 9px; background: var(--tint); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
.mname { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msub { font-size: 11px; color: var(--text-2); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.minidrop { border: 1.5px dashed var(--hair-strong); border-radius: 12px; padding: 12px; text-align: center; font-size: 12px; color: var(--text-2); }
.mfoot { display: flex; align-items: center; gap: 8px; padding: 10px 6px 2px; font-size: 13px; color: var(--text); border-top: 0.5px solid var(--hair); margin-top: 10px; }
</style></head>
<body><script src="shared.js"></script><script src="files.js"></script>
<script>
const { I, T, flow } = SC, F = FILES;
const sm = (svg, s) => `<div style="transform:scale(${s})">${svg}</div>`;
const row = (f, thumb, extra = "") => `<div class="mrow c-${f.cat}"><div class="mthumb">${sm(thumb, .34)}</div><div style="min-width:0;flex:1"><div class="mname">${f.name}</div><div class="msub"><span class="pill src c-${f.cat}" style="height:18px;font-size:10px;padding:0 6px">${f.src}</span>${flow(f.cat, f.dstCat)}<span class="pill dst c-${f.dstCat}" style="height:20px;font-size:10.5px;padding:0 6px 0 8px">${f.dst}${I.down}</span>${extra}</div></div></div>`;
SC.scene(`
  <div class="menubar"><span class="app">Finder</span><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    <span class="r"><span class="status on">${I.logo}</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6.5a9 9 0 0 1 12 0M4.3 9a5.6 5.6 0 0 1 7.4 0M6.6 11.4a2.2 2.2 0 0 1 2.8 0"/></svg><svg viewBox="0 0 24 16"><rect x="1" y="3" width="19" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="5" width="13" height="6" rx="1.6" fill="currentColor"/><rect x="21" y="6" width="2" height="4" rx="1" fill="currentColor"/></svg><span>Thu 22 Oct  3:41 PM</span></span></div>
  <div class="panel" style="left:828px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px"><b style="font:700 15px var(--rounded)">Super Converter</b><span class="hint">2 files dropped</span></div>
    ${row(F.heic, T.photo(0))}
    ${row({ ...F.mov, name: "Screen recording 2026-10-22.mov", dst: "MP4" }, T.video("0:31", 7))}
    <div style="display:flex;gap:8px;margin:10px 4px 4px"><span class="primary" style="flex:1;justify-content:center;height:40px;font-size:14px;background:linear-gradient(100deg,var(--img-deep),var(--vid-deep));color:#fff">Convert 2 files${I.right}</span></div>
    <div class="hint" style="padding:4px 8px 2px">Saved next to the originals · <span style="color:var(--accent)">Change…</span></div>
    <div class="sec-head" style="margin:14px 8px 4px">Recently converted</div>
    <div class="mrow c-doc"><div class="mthumb">${sm(T.page("doc", { title: 1 }), .34)}</div><div style="flex:1;min-width:0"><div class="mname">Invoice 0412.pdf</div><div class="msub">from DOCX · 2 min ago</div></div><span class="icon-btn">${I.folder}</span></div>
    <div class="mrow c-aud"><div class="mthumb">${sm(T.audio(), .34)}</div><div style="flex:1;min-width:0"><div class="mname">Voice memo.m4a</div><div class="msub">from AMR · 10 min ago</div></div><span class="icon-btn">${I.folder}</span></div>
    <div class="mfoot"><span>Open Super Converter</span><span style="flex:1"></span><span class="kbd">⌘O</span><span class="icon-btn">${I.gear}</span></div>
  </div>
`);
</script></body></html>
