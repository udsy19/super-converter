# External corpus for the quality bench (quality §9), read by scripts/fetch-corpus.sh. Every entry is pinned by SHA-256 and
# comes only from a source whose licence permits redistribution for testing. Downloads land in Tests/Corpus/external/ (git-ignored).
#
#   <id>   <path under external/>   <sha256>   <url>   <licence>   [extract]
#
# `extract` unpacks a .tar.gz next to the file. To add a source: `scripts/fetch-corpus.sh --pin <url>` prints the line (with the
# hash of what it downloaded) for review; commit it here. Planned sources, to be pinned as the kits that need them land:
# raw.pixls.us (CC0, RAW files), Xiph media test collection (CC/public-domain clips), Google Fonts (OFL), LibreOffice public test
# documents (MPL-2.0), Wikimedia Commons public-domain images.
